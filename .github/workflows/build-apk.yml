name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Gerar estrutura Android (se não existir)
        run: |
          if [ ! -f android/gradlew ]; then
            mkdir -p /tmp/bak
            cp -r lib /tmp/bak/lib
            cp pubspec.yaml /tmp/bak/pubspec.yaml
            if [ -f android/app/src/main/AndroidManifest.xml ]; then
              cp android/app/src/main/AndroidManifest.xml /tmp/bak/AndroidManifest.xml
            fi
            flutter create --platforms=android --org br.com.combustivel --project-name combustivel_sp .
            rm -rf lib
            cp -r /tmp/bak/lib lib
            cp /tmp/bak/pubspec.yaml pubspec.yaml
            if [ -f /tmp/bak/AndroidManifest.xml ]; then
              cp /tmp/bak/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            fi
          fi
          rm -f test/widget_test.dart
      - name: Dependências
        run: flutter pub get
      - name: Compilar APK release
        run: flutter build apk --release
      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: combustivel-sp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar em Releases (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
