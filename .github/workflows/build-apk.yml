name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.3'
          cache: true
      - name: Gerar estrutura Android limpa e propriedades
        run: |
          mkdir -p /tmp/bak
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/bak/AndroidManifest.xml
          fi
          
          rm -rf android
          flutter create --platforms=android --org br.com.combustivel --project-name combustivel_sp .
          
          if [ -f /tmp/bak/AndroidManifest.xml ]; then
            cp /tmp/bak/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          
          rm -f test/widget_test.dart
          
          # Força as variáveis que o geolocator precisa para não falhar
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
      - name: Atualizar dependências
        run: flutter pub upgrade
      - name: Compilar APK release
        run: flutter build apk --release
      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: combustivel-sp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
